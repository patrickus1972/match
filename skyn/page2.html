<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYN — editor</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="ed" id="editor">
    <!-- ===== Header ===== -->
    <header class="ed-header">
      <div class="ed-brand">
        <a href="index.html" data-nav="home" aria-label="SKYN home"><img class="logo" src="assets/skyn-logo.png" alt="SKYN"></a>
      </div>
      <div class="ed-actions">
        <span class="token-pill"><span class="coin">S</span><b id="token-count">1,240</b></span>
        <button class="avatar" type="button" title="Account">K</button>
        <button class="cart-btn" type="button" title="Cart">
          <svg viewBox="0 0 24 24"><path d="M4 5h2l1.5 11h10L20 8H7"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
          <span class="cart-badge" id="cart-badge">3</span>
        </button>
      </div>
    </header>

    <!-- ===== Main split ===== -->
    <div class="ed-main">
      <!-- viewer -->
      <section class="ed-stage" id="stage">
       <div class="ed-tools">
        <div class="ed-toolbar">
          <div class="seg" id="mode-seg">
            <button class="active" data-mode="shaded"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>Shaded</button>
            <button data-mode="normal">Normal</button>
            <button data-mode="diffuse">Diffuse</button>
            <button data-mode="roughness">Roughness</button>
          </div>
          <button class="tool-btn" id="uv-btn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>UV</button>
          <button class="tool-btn" id="wire-btn"><svg viewBox="0 0 24 24"><path d="M12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Wireframe</button>
        </div>

        <div class="ed-subtools">
          <button class="chip-btn ghost" id="rename-btn"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16Z"/></svg><span id="proj-name">hoodie-pro</span></button>
          <button class="chip-btn ghost" id="addproj-btn"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>Add to project <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
       </div>

        <div class="viewer">
          <!-- hoodie SVG (recolourable via CSS vars) -->
          <svg class="hoodie" id="hoodie" viewBox="0 0 420 430" role="img" aria-label="hoodie preview">
            <defs>
              <linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(255,255,255,.28)"/>
                <stop offset=".45" stop-color="rgba(255,255,255,0)"/>
                <stop offset="1" stop-color="rgba(20,18,26,.20)"/>
              </linearGradient>
              <linearGradient id="uvgrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff2d7e"/><stop offset=".33" stop-color="#ffd23f"/>
                <stop offset=".66" stop-color="#1fd1a4"/><stop offset="1" stop-color="#2a6df0"/>
              </linearGradient>
            </defs>
            <!-- sleeves -->
            <path class="p-sl"  d="M154,152 C124,158 110,184 100,230 L80,318 C77,332 86,342 100,338 L136,328 C128,300 128,240 142,192 C146,176 150,162 154,152 Z"/>
            <path class="p-sr"  d="M266,152 C296,158 310,184 320,230 L340,318 C343,332 334,342 320,338 L284,328 C292,300 292,240 278,192 C274,176 270,162 266,152 Z"/>
            <!-- body -->
            <path class="p-body" d="M150,150 C134,158 128,182 126,214 L120,356 C120,364 126,370 134,370 L286,370 C294,370 300,364 300,356 L294,214 C292,182 286,158 270,150 C248,168 210,172 210,172 C210,172 172,168 150,150 Z"/>
            <!-- cuffs + hem (rib) -->
            <path class="p-rib" d="M80,320 L136,308 L142,338 L92,344 Z"/>
            <path class="p-rib" d="M340,320 L284,308 L278,338 L328,344 Z"/>
            <path class="p-rib" d="M122,348 L298,348 L300,356 C300,364 294,370 286,370 L134,370 C126,370 120,364 120,356 Z"/>
            <!-- hood (filled dome + opening) -->
            <path class="p-hood" d="M150,162 C140,90 174,50 210,50 C246,50 280,90 270,162 C250,152 232,148 210,148 C188,148 168,152 150,162 Z"/>
            <path class="p-hoodin" d="M180,156 C180,124 192,110 210,110 C228,110 240,124 240,156 C228,150 222,148 210,148 C198,148 192,150 180,156 Z"/>
            <!-- pocket -->
            <path class="p-pocket" d="M156,266 C156,258 162,254 170,256 C184,300 236,300 250,256 C258,254 264,258 264,266 L264,332 C264,340 258,346 250,346 L170,346 C162,346 156,340 156,332 Z"/>
            <!-- drawstrings -->
            <path class="p-string" d="M197,150 C196,180 195,206 195,230" fill="none" stroke-width="3" stroke-linecap="round"/>
            <path class="p-string" d="M223,150 C224,180 225,206 225,230" fill="none" stroke-width="3" stroke-linecap="round"/>
            <circle class="p-toggle" cx="195" cy="234" r="4.5"/>
            <circle class="p-toggle" cx="225" cy="234" r="4.5"/>
            <!-- logo -->
            <text class="logo" x="210" y="210" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1">SKYN</text>
            <!-- shading overlays -->
            <path class="shade" d="M150,150 C134,158 128,182 126,214 L120,356 C120,364 126,370 134,370 L286,370 C294,370 300,364 300,356 L294,214 C292,182 286,158 270,150 C248,168 210,172 210,172 C210,172 172,168 150,150 Z" fill="url(#shadeGrad)" style="mix-blend-mode:multiply"/>
            <path class="shade" d="M154,152 C124,158 110,184 100,230 L80,318 C77,332 86,342 100,338 L136,328 C128,300 128,240 142,192 C146,176 150,162 154,152 Z" fill="url(#shadeGrad)" style="mix-blend-mode:multiply"/>
            <path class="shade" d="M266,152 C296,158 310,184 320,230 L340,318 C343,332 334,342 320,338 L284,328 C292,300 292,240 278,192 C274,176 270,162 266,152 Z" fill="url(#shadeGrad)" style="mix-blend-mode:multiply"/>
            <path class="shade" d="M150,162 C140,90 174,50 210,50 C246,50 280,90 270,162 C250,152 232,148 210,148 C188,148 168,152 150,162 Z" fill="url(#shadeGrad)" style="mix-blend-mode:multiply"/>
          </svg>
        </div>

        <div class="stats">
          <h4>STATS</h4>
          <div class="row"><span>Triangles</span><span>8,240</span></div>
          <div class="row"><span>Quads</span><span>4,120</span></div>
          <div class="row"><span>Texture</span><span>4K PBR</span></div>
        </div>
      </section>

      <!-- Add colours panel (inline, non-blocking — sits beside the variants) -->
      <div class="palette-panel" id="palette-panel" hidden>
        <div class="pm-head">
          <div>
            <h3>Add colours</h3>
            <p class="pm-sub"><span id="pm-count">15</span> palettes · pick a full palette</p>
          </div>
          <button class="pm-close" data-close type="button" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="pm-list" id="pm-list"></div>
        <button class="pm-render" id="pm-render" type="button" disabled>Select a palette to render</button>
        <p class="pm-note">Tap a palette to add all its colours</p>
      </div>

      <!-- sidebar -->
      <aside class="ed-side">
        <div class="colours-panel">
          <div class="colours-total">Colours: <b id="col-total">18</b></div>
          <div class="themes" id="themes"></div>
          <button class="gen-btn" id="gen-btn"><span class="plus">+</span> Generate more variants
            <span class="cost"><span class="coin">S</span>10</span>
          </button>
          <p class="gen-note">Each variant 10 tokens</p>
        </div>
        <button class="addcart" id="addcart"><svg viewBox="0 0 24 24"><path d="M8 8 16 16M16 9.5v6.5h-6.5"/></svg> Add to cart <span class="free">· free</span></button>
      </aside>
    </div>
  </div>

  <div class="ed-toast" id="ed-toast"></div>
  <script src="editor.js"></script>
</body>
</html>
